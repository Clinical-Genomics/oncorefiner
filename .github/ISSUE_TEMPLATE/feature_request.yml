name: User story
description: Feature request
labels: ["User-Story"]
body:
  - type: textarea
    attributes:
      label: Need
      description: Describe the need from the perspective of the user.
      value: |
        As a <role>,
        I want <functionality>
        because of <reason>.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: |
        List the requirements needed for this feature to be implemented.
        If you are unsure, fill in with "Refinement needed".
      value: |
        - [ ] <acceptance criterium>
        - [ ] <acceptance criterium>
    validations:
      required: true

  - type: textarea
    attributes:
      label: Addional information
      description: |
        Please provide any information that can give us more context about this issue.
      value: |
        - Suggested approach
        <!-- Any ideas on how this should be implemented? -->

        - Considered alternatives
        <!-- Were there alternative approaches which have been rejected? -->

        - Blockers
        <!-- Anything preventing this from happening?

        - Other notes
        <!-- Links? References? -->
    validations:
      required: true
