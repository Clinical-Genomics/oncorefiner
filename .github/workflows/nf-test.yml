name: Run nf-test
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/meta.yml"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  release:
    types: [published]
  workflow_dispatch:

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NFT_VER: "0.9.3"
  NFT_WORKDIR: "~"
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity

jobs:
  find-tests:
    runs-on: ubuntu-latest  
    outputs:
      tags: ${{ steps.find.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: get subworkflows
        id: find
        uses: ./.github/actions/find-tests

      - name: debug
        run: |
          echo ${{ steps.find.outputs.tags }}

  nf-test:
    name: "${{ matrix.tag }} | ${{ matrix.profile }} | ${{ matrix.NXF_VER }}"
    needs: [find-tests]
    runs-on: # use GitHub runners
      - "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        profile: [docker, singularity]
        tag: ${{ fromJson(needs.find-tests.outputs.tags) }}
        isMain:
          - ${{ github.base_ref == 'master' || github.base_ref == 'main' }}
        # Exclude conda and singularity on dev
        exclude:
          - isMain: false
            profile: "singularity"
        NXF_VER:
          - "25.04.0"
          - "latest-everything"
    env:
      NXF_ANSI_LOG: false
      TOTAL_SHARDS: ${{ needs.find-tests.outputs.total_shards }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Run nf-test
        if: matrix.profile != ''
        uses: ./.github/actions/nf-test
        continue-on-error: ${{ matrix.NXF_VER == 'latest-everything' }}
        env:
          NFT_WORKDIR: ${{ env.NFT_WORKDIR }}
        with:
          profile: ${{ matrix.profile }}
          shard: 1
          total_shards: 1

      # - name: Report test status
      #   if: ${{ always() }}
      #   run: |
      #     if [[ "${{ steps.run_nf_test.outcome }}" == "failure" ]]; then
      #       echo "::error::Test with ${{ matrix.NXF_VER }} failed"
      #       # Add to workflow summary
      #       echo "## ❌ Test failed: ${{ matrix.profile }} | ${{ matrix.NXF_VER }} | Shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}" >> $GITHUB_STEP_SUMMARY
      #       if [[ "${{ matrix.NXF_VER }}" == "latest-everything" ]]; then
      #         echo "::warning::Test with latest-everything failed but will not cause workflow failure. Please check if the error is expected or if it needs fixing."
      #       fi
      #       if [[ "${{ matrix.NXF_VER }}" != "latest-everything" ]]; then
      #         exit 1
      #       fi
      #     fi

  confirm-pass:
    needs: [nf-test]
    if: always()
    runs-on: # use GitHub runners
      - "ubuntu-latest"
    steps:
      - name: One or more tests failed (excluding latest-everything)
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: One or more tests cancelled
        if: ${{ contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All tests ok
        if: ${{ contains(needs.*.result, 'success') }}
        run: exit 0

      - name: debug-print
        if: always()
        run: |
          echo "::group::DEBUG: `needs` Contents"
          echo "DEBUG: toJSON(needs) = ${{ toJSON(needs) }}"
          echo "DEBUG: toJSON(needs.*.result) = ${{ toJSON(needs.*.result) }}"
          echo "::endgroup::"
