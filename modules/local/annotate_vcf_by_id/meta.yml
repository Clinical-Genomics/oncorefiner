name: "annotate_vcf_by_id"
description: Annotates VCF files by ID.
keywords:
  - python
  - annotate
  - genomics
tools:
  - "python":
      description: "Annotates VCF files by ID."
      homepage: "https://www.python.org/"
      documentation: "https://docs.python.org/3/"
      tool_dev_url: "https://github.com/python/cpython"
      doi: ""
      licence: ["MIT"]
      identifier: biotools:python
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - vcf_file:
        type: file
        description: VCF file to be annotated
        pattern: "*.vcf"
    - tsv_file:
        type: file
        description: TSV file to use for annotation with the format ID\tTAG1\tTAG2\t...\tTAGN
        pattern: "*.tsv"
    - header_file:
        type: file
        description: VCF header file
        pattern: "*.txt"
output:
  - vcf:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.vcf":
          type: file
          description: Annotated VCF file
          pattern: "*.vcf"
  - tbi:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.vcf.tbi":
          type: file
          description: Annotated VCF index file
          pattern: "*.vcf.tbi"
authors:
  - "@kristinebilgrav"
maintainers:
  - "@kristinebilgrav"
