name: "vcf_annotate_linx_fusions"
description: Annotates VCF files by ID with LINX fusion information.
keywords:
  - python
  - annotate
  - genomics
tools:
  - "vcf_annotate_linx_fusions":
      description: "Annotates VCF files by ID with LINX fusion information."
      identifier: vcf_annotate_linx_fusions
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing case information
          e.g. `[id: case_id, case_id: case_id]`
    - vcf_file:
        type: file
        description: VCF file to be annotated
        pattern: "*.vcf"
    - tsv_file:
        type: file
        description: TSV file to use for annotation with the format TAG1\tTAG2\t...\tTAGN, header required. Column names "fivePrimeVcfId",  "threePrimeVcfId", "name" and "reported" must be included.
        pattern: "*.tsv"
    - header_file:
        type: file
        description: VCF header file describing the new fields to add, e.g. "##INFO=<ID=REPORTED,Number=0,Type=Flag,Description="Variant is a reported fusion">"
        pattern: "*.txt"
output:
  - vcf:
      - meta:
          type: map
          description: |
            Groovy Map containing case information
            e.g. `[id: case_id, case_id: case_id]`
      - "*.vcf":
          type: file
          description: Annotated VCF file
          pattern: "*.vcf"
  - tbi:
      - meta:
          type: map
          description: |
            Groovy Map containing case information
            e.g. `[id: case_id, case_id: case_id]`
      - "*.vcf.tbi":
          type: file
          description: Annotated VCF index file
          pattern: "*.vcf.tbi"
authors:
  - "@kristinebilgrav"
maintainers:
  - "@kristinebilgrav"
