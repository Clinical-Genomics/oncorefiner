## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
##     Clinical-Genomics/oncorefiner 1.0.0dev
## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
##     This is an example parameter file to pass to the `-params-file` option
##     of nextflow run with the Clinical-Genomics/oncorefiner pipeline.
##
##     Uncomment lines with a single '#' if you want to pass the parameter to
##     the pipeline.
## -----------------------------------------------------------------------------

## =============================================================================
## Input/output options
## =============================================================================
## Define where the pipeline should find input data and save output data.

## -----------------------------------------------------------------------------
## input
## -----------------------------------------------------------------------------
##     Path to comma-separated file containing information about the samples
##     in the experiment.
##     Type: string
##     Required
## -----------------------------------------------------------------------------
# input: null

## -----------------------------------------------------------------------------
## outdir
## -----------------------------------------------------------------------------
##     The output directory where the results will be saved. You have to use
##     absolute paths to storage on Cloud infrastructure.
##     Type: string
##     Required
## -----------------------------------------------------------------------------
# outdir: null

## -----------------------------------------------------------------------------
## snv_vcf
## -----------------------------------------------------------------------------
##     Path to a VCF file containing somatic SNV/INDEL variants to be
##     processed by the pipeline. The VCF may include one or multiple
##     samples. Typically, this is a single tumor sample for tumor-only
##     analyses, or both tumor and matched normal samples for tumor-normal
##     analyses.
##     Type: string
## -----------------------------------------------------------------------------
# snv_vcf: null

## -----------------------------------------------------------------------------
## sv_vcf
## -----------------------------------------------------------------------------
##     Path to a VCF file containing somatic structural variants (SVs) to be
##     processed by the pipeline. The VCF may include one or multiple
##     samples. Typically, this is a single tumor sample for tumor-only
##     analyses, or both tumor and matched normal samples for tumor-normal
##     analyses.
##     Type: string
## -----------------------------------------------------------------------------
# sv_vcf: null

## -----------------------------------------------------------------------------
## email
## -----------------------------------------------------------------------------
##     Email address for completion summary.
##     Type: string
## -----------------------------------------------------------------------------
# email: null

## -----------------------------------------------------------------------------
## multiqc_title
## -----------------------------------------------------------------------------
##     MultiQC report title. Printed as page header, used for filename if not
##     otherwise specified.
##     Type: string
## -----------------------------------------------------------------------------
# multiqc_title: null

## =============================================================================
## Reference genome options
## =============================================================================
## Reference genome related files and options required for the workflow.

## -----------------------------------------------------------------------------
## genome
## -----------------------------------------------------------------------------
##     Name of the genome reference.
##     Type: string
## -----------------------------------------------------------------------------
# genome: "GRCh38"

## -----------------------------------------------------------------------------
## fasta
## -----------------------------------------------------------------------------
##     Path to FASTA genome file.
##     Type: string
## -----------------------------------------------------------------------------
# fasta: null

## -----------------------------------------------------------------------------
## fai
## -----------------------------------------------------------------------------
##     Path to FASTA genome index file.
##     Type: string
## -----------------------------------------------------------------------------
# fai: null

## -----------------------------------------------------------------------------
## cadd_prescored_indels
## -----------------------------------------------------------------------------
##     Path to a directory containing prescored indels for CADD.
##     Type: string
## -----------------------------------------------------------------------------
# cadd_prescored_indels: null

## -----------------------------------------------------------------------------
## cadd_resources
## -----------------------------------------------------------------------------
##     Path to the directory containing cadd annotations.
##     Type: string
## -----------------------------------------------------------------------------
# cadd_resources: null

## -----------------------------------------------------------------------------
## species
## -----------------------------------------------------------------------------
##     Species of the reference genome. E.g. `--species homo_sapiens`.
##     Type: string
## -----------------------------------------------------------------------------
# species: "homo_sapiens"

## =============================================================================
## Annotation options
## =============================================================================
## Annotation related files and options required for the workflow.

## -----------------------------------------------------------------------------
## vep_cache_version
## -----------------------------------------------------------------------------
##     Specify the version of the VEP cache provided to the `--vep_cache`
##     option.
##     Type: integer
## -----------------------------------------------------------------------------
# vep_cache_version: 112

## -----------------------------------------------------------------------------
## vep_cache
## -----------------------------------------------------------------------------
##     Path to vep's cache directory.
##     Type: string
## -----------------------------------------------------------------------------
# vep_cache: null

## -----------------------------------------------------------------------------
## vep_plugin_files
## -----------------------------------------------------------------------------
##     Databases used by both named and custom plugins to annotate variants.
##     Type: string
## -----------------------------------------------------------------------------
# vep_plugin_files: null

## -----------------------------------------------------------------------------
## vcfanno_extra
## -----------------------------------------------------------------------------
##     Path to a VCF file containing annotations.
##     Type: string
## -----------------------------------------------------------------------------
# vcfanno_extra: null

## -----------------------------------------------------------------------------
## vcfanno_resources
## -----------------------------------------------------------------------------
##     Path to a file containing the absolute paths to resources defined
##     within the vcfanno toml file. One line per resource.
##     Type: string
## -----------------------------------------------------------------------------
# vcfanno_resources: null

## -----------------------------------------------------------------------------
## vcfanno_toml
## -----------------------------------------------------------------------------
##     Path to the vcfanno toml file.
##     Type: string
## -----------------------------------------------------------------------------
# vcfanno_toml: null

## -----------------------------------------------------------------------------
## vcfanno_lua
## -----------------------------------------------------------------------------
##     Path to the vcfanno lua file.
##     Type: string
## -----------------------------------------------------------------------------
# vcfanno_lua: null

## -----------------------------------------------------------------------------
## svdb_query_dbs
## -----------------------------------------------------------------------------
##     Databases used for structural variant annotation in vcf format.
##     Type: string
## -----------------------------------------------------------------------------
# svdb_query_dbs: null

## =============================================================================
## Institutional config options
## =============================================================================
## Parameters used to describe centralised config profiles. These should not
## be edited.

## (6 hidden parameters are not shown)

## =============================================================================
## Generic options
## =============================================================================
## Less common options for the pipeline, typically set in a config file.

## (12 hidden parameters are not shown)

## -----------------------------------------------------------------------------
## multiqc_methods_description
## -----------------------------------------------------------------------------
##     Custom MultiQC yaml file containing HTML including a methods
##     description.
##     Type: string
## -----------------------------------------------------------------------------
# multiqc_methods_description: null

## -----------------------------------------------------------------------------
## help
## -----------------------------------------------------------------------------
##     Display the help message.
##     Type: ['boolean', 'string']
## -----------------------------------------------------------------------------
# help: null

## -----------------------------------------------------------------------------
## help_full
## -----------------------------------------------------------------------------
##     Display the full detailed help message.
##     Type: boolean
## -----------------------------------------------------------------------------
# help_full: null

## -----------------------------------------------------------------------------
## show_hidden
## -----------------------------------------------------------------------------
##     Display hidden parameters in the help message (only works when --help
##     or --help_full are provided).
##     Type: boolean
## -----------------------------------------------------------------------------
# show_hidden: null
